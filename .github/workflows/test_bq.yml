name: Test BigQuery Connection

on:
  workflow_dispatch: # Allows you to trigger it manually from the "Actions" tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-cloud-bigquery

      - name: Run Connection Test
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=gcp_key.json
          python test_connection.py
